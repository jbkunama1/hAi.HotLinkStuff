<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hAI.HotStuff</title>
  <meta name="description" content="HotStuff und PromptSave in einer Oberfläche mit zentralem Login." />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body class="view-hotstuff">
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <div class="shell-layout">
    <header class="shell-header">
      <div class="shell-header-top">
        <div class="shell-brand">
        <div class="shell-brand-mark">🔥🧠</div>
        <h1 class="shell-brand-title">hAI.HotLinkStuff</h1>
        </div>
        <div class="status shell-status" id="statusText">Verbinde ...</div>
        <div class="shell-actions">
          <button class="shell-tab-pill shell-logout" id="logoutBtn" type="button">
            <span class="icon">↪</span><span>Abmelden</span>
          </button>
          <button class="shell-hamburger" id="hamburgerBtn" type="button" aria-label="Menü öffnen" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
      <nav class="shell-tabs" aria-label="Hauptnavigation">
        <button class="shell-tab-pill active" data-view="hotstuff">
          <span class="icon">🔥</span>
          <span>HotStuff</span>
        </button>
        <button class="shell-tab-pill" data-view="promptsave">
          <span class="icon">🧠</span>
          <span>PromptSave</span>
        </button>
        <button class="shell-tab-pill" data-view="admin">
          <span class="icon">⚙️</span>
          <span>Admin</span>
        </button>
        <button class="shell-tab-pill" data-view="markdown-import">
          <span class="icon">📥</span>
          <span>Markdown</span>
        </button>
      </nav>
    </header>

    <section class="shell-main">
      <article class="shell-card">
        <div class="shell-frame-wrap">
          <iframe
            id="contentFrame"
            src="modules/hotstuff.html"
            title="HotStuff"
            loading="lazy"
          ></iframe>
        </div>
      </article>
    </section>
  </div>

  <div class="shell-menu-overlay" id="menuOverlay">
    <div class="shell-menu-card">
      <div class="shell-menu-heading">Bereiche</div>
      <button class="shell-menu-link active" data-view="hotstuff">
        <span class="icon">🔥</span><span>HotStuff</span>
      </button>
      <button class="shell-menu-link" data-view="promptsave">
        <span class="icon">🧠</span><span>PromptSave</span>
      </button>
      <button class="shell-menu-link" data-view="admin">
        <span class="icon">⚙️</span><span>Admin</span>
      </button>
      <button class="shell-menu-link" data-view="markdown-import">
        <span class="icon">📥</span><span>Markdown-Import</span>
      </button>
      <button class="shell-menu-link shell-menu-logout" id="menuLogoutBtn" type="button">
        <span class="icon">↪</span><span>Abmelden</span>
      </button>
    </div>
  </div>

  <script>
    const frame = document.getElementById('contentFrame');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const logoutBtn = document.getElementById('logoutBtn');
    const menuLogoutBtn = document.getElementById('menuLogoutBtn');

    const tabButtons = Array.from(document.querySelectorAll('.shell-tab-pill[data-view]'));
    const menuLinks = Array.from(document.querySelectorAll('.shell-menu-link'));

    function setView(view) {
      if (view === 'hotstuff') {
        frame.src = 'modules/hotstuff.html';
        frame.title = 'HotStuff';
        document.body.className = 'view-hotstuff';
      } else if (view === 'promptsave') {
        frame.src = 'modules/promptsave.html';
        frame.title = 'PromptSave';
        document.body.className = 'view-promptsave';
      } else if (view === 'admin') {
        frame.src = 'modules/admin.html';
        frame.title = 'Admin';
        document.body.className = 'view-admin';
      } else if (view === 'markdown-import') {
        frame.src = 'modules/markdown-import.html';
        frame.title = 'Markdown-Import';
        document.body.className = 'view-markdown-import';
      }

      tabButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });

      menuLinks.forEach(link => {
        link.classList.toggle('active', link.dataset.view === view);
      });

      menuOverlay.classList.remove('show');
      hamburgerBtn.setAttribute('aria-expanded', 'false');
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        setView(link.dataset.view);
      });
    });

    hamburgerBtn.addEventListener('click', () => {
      menuOverlay.classList.toggle('show');
      hamburgerBtn.setAttribute('aria-expanded', menuOverlay.classList.contains('show'));
    });

    menuOverlay.addEventListener('click', e => {
      if (e.target === menuOverlay) {
        menuOverlay.classList.remove('show');
        hamburgerBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Logout führt auf logout.php im app-Ordner
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        window.location.href = 'logout.php';
      });
    }
    if (menuLogoutBtn) {
      menuLogoutBtn.addEventListener('click', () => {
        window.location.href = 'logout.php';
      });
    }

    // Optional: view-Parameter aus URL (z. B. ?view=promptsave)
    (function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const view = params.get('view');
      if (view === 'promptsave') {
        setView('promptsave');
      } else if (view === 'markdown-import') {
        setView('markdown-import');
      } else {
        setView('hotstuff');
      }
    })();

    // Optional: einfacher API-Test (nur Konsole)
    async function testApi() {
      const status = document.getElementById('statusText');
      try {
        const match = document.cookie.match(/(^| )hotlinkstuff_pw=([^;]+)/);
        const pw = match ? decodeURIComponent(match[2]) : '';
        if (!pw) {
          status.textContent = 'Anmeldung erforderlich';
          return;
        }
        const res = await fetch('api.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            resource: 'items',
            action: 'test',
            password: pw
          })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || `HTTP ${res.status}`);
        status.textContent = 'Verbindung OK';
        status.style.color = '#22c55e';
      } catch (e) {
        status.textContent = `Fehler: ${e.message}`;
        status.style.color = '#f87171';
      }
    }

    testApi();

    /* ── Globale Theme- & Layout-Steuerung ─────────────────────────
       Einstellungen werden vom Admin-Modul verwaltet und per postMessage
       an die Shell und ihre iframes verteilt. */

    function broadcastPreferences(mode, theme, cols) {
      if (frame.contentWindow) {
        frame.contentWindow.postMessage({ type: 'shell-preferences', mode, theme, cols }, '*');
      }
    }

    function applyPreferences(mode, theme, cols) {
      document.body.dataset.mode = mode;
      document.body.dataset.theme = theme;
      broadcastPreferences(mode, theme, cols);
    }

    // Shell bootet mit gespeicherten Werten aus localStorage
    (function initFromStorage() {
      const mode = localStorage.getItem('hotlinkstuff_mode') || 'dark';
      const theme = localStorage.getItem('hotlinkstuff_theme') || 'cloud';
      const cols = localStorage.getItem('hotlinkstuff_cols') || '3';
      applyPreferences(mode, theme, cols);
    })();

    // Empfange shell-preferences vom Admin-Modul
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'shell-preferences') {
        const { mode, theme, cols } = e.data;
        localStorage.setItem('hotlinkstuff_mode', mode);
        localStorage.setItem('hotlinkstuff_theme', theme);
        localStorage.setItem('hotlinkstuff_cols', cols);
        applyPreferences(mode, theme, cols);
      }
    });
  </script>
</body>
</html>
