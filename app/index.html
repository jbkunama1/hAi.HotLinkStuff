<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hAI.HotStuff</title>
  <meta name="description" content="HotStuff und PromptSave in einer Oberfläche mit zentralem Login." />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body class="view-hotstuff">
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <div class="shell-layout">
    <header class="shell-header">
      <div class="shell-brand">
        <div class="shell-brand-mark">🔥🧠</div>
        <div>
          <h1 class="shell-brand-title">hAI.HotLinkStuff</h1>
          <p class="shell-brand-subtitle">HotStuff &amp; PromptSave mit zentralem Login</p>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="shell-controls">
          <select id="shellThemeSelect" class="theme-select" aria-label="Theme wählen">
            <option value="ember">🔥 Ember</option>
            <option value="ocean">🌊 Ocean</option>
            <option value="violet">🔮 Violet</option>
            <option value="frost">❄️ Frost</option>
            <option value="mint">🌿 Mint</option>
            <option value="sunset">🌅 Sunset</option>
            <option value="cloud">☁️ Cloud (High-End)</option>
          </select>
          <select id="shellLayoutSelect" class="theme-select" aria-label="Layout wählen">
            <option value="3">▦ 3 Spalten</option>
            <option value="2">▤ 2 Spalten</option>
            <option value="1">▬ Untereinander</option>
          </select>
          <button class="shell-tab-pill" id="modeToggleBtn" type="button">☀️ Hell</button>
        </div>
        <button class="shell-tab-pill" id="logoutBtn" type="button">
          <span>Logout</span>
        </button>
        <div class="shell-hamburger" id="hamburgerBtn" aria-label="Menü öffnen">
          <span></span><span></span><span></span>
        </div>
      </div>
    </header>

    <section class="shell-main">
      <article class="shell-card">
        <div class="shell-subhead">
          <div>
            <h2 id="viewTitle" class="shell-subhead-title">HotStuff</h2>
            <p id="viewSubtitle" class="shell-subhead-text">
              Links, Bilder und Textbausteine verwalten.
            </p>
          </div>
          <div class="shell-tabs">
            <button class="shell-tab-pill active" data-view="hotstuff">
              <span class="icon">🔥</span>
              <span>HotStuff</span>
            </button>
            <button class="shell-tab-pill" data-view="promptsave">
              <span class="icon">🧠</span>
              <span>PromptSave</span>
            </button>
                      <button class="shell-tab-pill" data-view="admin">
                        <span class="icon">⚙️</span>
                        <span>Admin</span>
                      </button>
                    </div>
        </div>

        <div class="shell-frame-wrap">
          <iframe
            id="contentFrame"
            src="modules/hotstuff.html"
            title="HotStuff"
            loading="lazy"
          ></iframe>
        </div>

      </article>
    </section>
  </div>

  <div class="shell-menu-overlay" id="menuOverlay">
    <div class="shell-menu-card">
      <h3>Module wählen</h3>
      <button class="shell-menu-link active" data-view="hotstuff">
        <span class="icon">🔥</span>
        <span>HotStuff – Material &amp; Links</span>
      </button>
      <button class="shell-menu-link" data-view="promptsave">
        <span class="icon">🧠</span>
        <span>PromptSave – Prompts</span>
      </button>
      <button class="shell-menu-link" data-view="admin">
        <span class="icon">⚙️</span>
        <span>Admin – Einstellungen</span>
      </button>
    </div>
  </div>

  <script>
    const frame = document.getElementById('contentFrame');
    const viewTitle = document.getElementById('viewTitle');
    const viewSubtitle = document.getElementById('viewSubtitle');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const logoutBtn = document.getElementById('logoutBtn');

    const tabButtons = Array.from(document.querySelectorAll('.shell-tab-pill[data-view]'));
    const menuLinks = Array.from(document.querySelectorAll('.shell-menu-link'));

    function setView(view) {
      if (view === 'hotstuff') {
        frame.src = 'modules/hotstuff.html';
        frame.title = 'HotStuff';
        viewTitle.textContent = 'HotStuff';
        viewSubtitle.textContent = 'Links, Bilder und Textbausteine verwalten.';
        document.body.className = 'view-hotstuff';
      } else if (view === 'promptsave') {
        frame.src = 'modules/promptsave.html';
        frame.title = 'PromptSave';
        viewTitle.textContent = 'PromptSave';
        viewSubtitle.textContent = 'Prompts sammeln, bearbeiten, importieren und exportieren.';
        document.body.className = 'view-promptsave';
      } else if (view === 'admin') {
        frame.src = 'modules/admin.html';
        frame.title = 'Admin';
        viewTitle.textContent = 'Admin';
        viewSubtitle.textContent = 'Systemverwaltung und Einstellungen.';
        document.body.className = 'view-admin';
      }


      tabButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });

      menuLinks.forEach(link => {
        link.classList.toggle('active', link.dataset.view === view);
      });
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        setView(link.dataset.view);
        menuOverlay.classList.remove('show');
      });
    });

    hamburgerBtn.addEventListener('click', () => {
      menuOverlay.classList.toggle('show');
    });

    menuOverlay.addEventListener('click', e => {
      if (e.target === menuOverlay) {
        menuOverlay.classList.remove('show');
      }
    });

    // Logout führt auf logout.php im app-Ordner
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        window.location.href = 'logout.php';
      });
    }

    // Optional: view-Parameter aus URL (z. B. ?view=promptsave)
    (function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const view = params.get('view');
      if (view === 'promptsave') {
        setView('promptsave');
      } else {
        setView('hotstuff');
      }
    })();

    // Optional: einfacher API-Test (nur Konsole)
    async function testApi() {
      try {
        const match = document.cookie.match(/(^| )hotlinkstuff_pw=([^;]+)/);
        const pw = match ? decodeURIComponent(match[2]) : '';
        if (!pw) return;
        const res = await fetch('api.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            resource: 'items',
            action: 'test',
            password: pw
          })
        });
        const data = await res.json();
        console.log('API-Test:', data);
      } catch (e) {
        console.warn('API-Test fehlgeschlagen', e);
      }
    }

    testApi();

    /* ── Globale Theme- & Layout-Steuerung ─────────────────────────
       Zentrale Preferences werden in localStorage (global_keys) und
       an die Module per postMessage verteilt. Module, die das noch
       nicht verstehen, bleiben unberührt. */
    const shellThemeSelect = document.getElementById('shellThemeSelect');
    const shellLayoutSelect = document.getElementById('shellLayoutSelect');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const globalKeys = ['hotlinkstuff_mode', 'hotlinkstuff_theme', 'hotlinkstuff_cols'];

    // Bekannte Theme-Namen der Module (Fallback pro Modul)
    const moduleThemeFallback = {
      hotstuff: 'ember',
      promptsave: 'frost'
    };

    function currentView() {
      return document.body.classList.contains('view-promptsave') ? 'promptsave' : 'hotstuff';
    }

    function moduleThemeKey(view) {
      return view === 'promptsave' ? 'promptsave_theme' : 'hotstuff_theme';
    }

    function broadcast() {
      const msg = {
        type: 'shell-preferences',
        mode: document.body.dataset.mode,
        theme: shellThemeSelect.value,
        cols: shellLayoutSelect.value
      };
      if (frame.contentWindow) frame.contentWindow.postMessage(msg, '*');
    }

    function applyShellPreferences() {
      document.body.dataset.mode = shellThemeSelect.dataset.mode;
      document.body.dataset.theme = shellThemeSelect.value;
      modeToggleBtn.textContent = shellThemeSelect.dataset.mode === 'dark' ? '☀️ Hell' : '🌙 Dunkel';
      broadcast();
    }

    function applyGlobalStorage() {
      globalKeys.forEach(key => localStorage.setItem(key, document.body.dataset[key.replace('hotlinkstuff_', '')]));
      localStorage.setItem(moduleThemeKey(currentView()), shellThemeSelect.value);
    }

    function initShellPreferences() {
      const adminDefault = localStorage.getItem('hotlinkstuff_admin_default_theme') || 'cloud';
      const userTheme = localStorage.getItem('hotlinkstuff_theme');
      const mode = localStorage.getItem('hotlinkstuff_mode') || 'dark';
      const theme = userTheme || adminDefault;
      const cols = localStorage.getItem('hotlinkstuff_cols') || '3';
      shellThemeSelect.dataset.mode = mode;
      shellThemeSelect.value = theme;
      shellLayoutSelect.value = cols;
      applyShellPreferences();
    }

    function broadcastFromModule() {
      /* Modul meldet eigenen Theme-Wechsel zurück: Shell übernimmt es. */
      const view = currentView();
      const mode = localStorage.getItem(view === 'promptsave' ? 'promptsave_mode' : 'hotstuff_mode');
      const theme = localStorage.getItem(moduleThemeKey(view));
      if (mode) {
        shellThemeSelect.dataset.mode = mode;
        applyShellPreferences();
      }
      if (theme) {
        shellThemeSelect.value = theme;
        applyShellPreferences();
      }
      applyGlobalStorage();
    }

    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'module-preferences') {
        broadcastFromModule();
      } else if (e.data && e.data.type === 'admin-default-theme-changed') {
        // Only update if no user override exists
        if (!localStorage.getItem('hotlinkstuff_theme')) {
           shellThemeSelect.value = e.data.theme;
           applyShellPreferences();
        }
      }
    });

    shellThemeSelect.addEventListener('change', () => {
      applyShellPreferences();
      applyGlobalStorage();
    });

    shellLayoutSelect.addEventListener('change', () => {
      applyGlobalStorage();
      broadcast();
    });

    modeToggleBtn.addEventListener('click', () => {
      shellThemeSelect.dataset.mode = shellThemeSelect.dataset.mode === 'dark' ? 'light' : 'dark';
      applyShellPreferences();
      applyGlobalStorage();
    });

    initShellPreferences();
  </script>
</body>
</html>
