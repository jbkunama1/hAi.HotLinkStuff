<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptSave</title>
  <style>
    :root {
      --bg: #020617;
      --surface: #0b1120;
      --surface-2: #020617;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #0ea5e9;
      --accent-2: #6366f1;
      --danger: #ef4444;
      --radius: 18px;
      --shadow: 0 14px 32px rgba(15, 23, 42, 0.45);
      --overlay: rgba(15, 23, 42, 0.65);
      --placeholder: #6b7280;
      --badge-bg: #0f172a;
      --badge-text: #22d3ee;
      --glow-a: rgba(14, 165, 233, 0.35);
      --glow-b: rgba(99, 102, 241, 0.35);
      --scrollbar-track: rgba(15, 23, 42, 0.55);
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 62%, var(--accent-2));
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent-2) 66%, #ffffff);
      --scrollbar-track: rgba(15, 23, 42, 0.55);
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 62%, var(--accent-2));
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent-2) 66%, #ffffff);
    }

    body[data-mode="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #eef2ff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
      --overlay: rgba(15, 23, 42, 0.35);
      --placeholder: #64748b;
      --badge-bg: #e2e8f0;
      --badge-text: #0369a1;
      --glow-a: rgba(14, 165, 233, 0.18);
      --glow-b: rgba(99, 102, 241, 0.18);
      --scrollbar-track: #dbeafe;
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 72%, #1f2937);
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent-2) 70%, #1f2937);
      --scrollbar-track: #dbeafe;
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 72%, #1f2937);
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent-2) 70%, #1f2937);
    }

    body[data-theme="mint"] {
      --accent: #10b981;
      --accent-2: #0d9488;
      --badge-text: #047857;
      --glow-a: rgba(16, 185, 129, 0.35);
      --glow-b: rgba(13, 148, 136, 0.35);
    }

    body[data-theme="sunset"] {
      --accent: #f97316;
      --accent-2: #ec4899;
      --badge-text: #c2410c;
      --glow-a: rgba(249, 115, 22, 0.35);
      --glow-b: rgba(236, 72, 153, 0.35);
    }

    body[data-theme="ember"] {
      --accent: #ea580c;
      --accent-2: #0f766e;
      --badge-text: #c2410c;
      --glow-a: rgba(234, 88, 12, 0.35);
      --glow-b: rgba(15, 118, 110, 0.35);
    }

    body[data-theme="ocean"] {
      --accent: #0284c7;
      --accent-2: #0f766e;
      --badge-text: #0369a1;
      --glow-a: rgba(2, 132, 199, 0.35);
      --glow-b: rgba(15, 118, 110, 0.35);
    }

    body[data-theme="violet"] {
      --accent: #7c3aed;
      --accent-2: #2563eb;
      --badge-text: #6d28d9;
      --glow-a: rgba(124, 58, 237, 0.35);
      --glow-b: rgba(37, 99, 235, 0.35);
    }

    * { box-sizing: border-box; }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 999px;
    }

    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--scrollbar-thumb), var(--accent-2));
      border-radius: 999px;
      border: 2px solid var(--scrollbar-track);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--scrollbar-thumb-hover), var(--accent));
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 999px;
    }

    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--scrollbar-thumb), var(--accent-2));
      border-radius: 999px;
      border: 2px solid var(--scrollbar-track);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--scrollbar-thumb-hover), var(--accent));
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, var(--glow-a), transparent 54%),
        radial-gradient(circle at bottom right, var(--glow-b), transparent 54%),
        var(--bg);
      color: var(--text);
      padding: 18px 12px 22px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .topbar {
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
    }

    .dot.ok { background: #22c55e; }
    .dot.error { background: var(--danger); }

    .toolbar {
      padding: 14px 16px;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .theme-controls {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) 220px;
      gap: 10px;
    }

    .search {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .search::placeholder {
      color: var(--placeholder);
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
    }

    .btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }

    .btn.secondary {
      background: var(--surface-2);
      border-color: var(--border);
    }

    .btn.danger {
      background: var(--surface-2);
      border-color: #fecaca;
      color: var(--danger);
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .btn.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    }

    .grid.cols-1,
    .grid.list-view {
      grid-template-columns: 1fr;
    }

    .grid.list-view .card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      grid-template-areas: "badge title actions";
      gap: 10px 14px;
      align-items: center;
      padding: 12px 16px;
    }

    .grid.list-view .card .meta { grid-area: badge; }
    .grid.list-view .card h3 { grid-area: title; margin: 0; }
    .grid.list-view .card .content { display: none; }
    .grid.list-view .card .small { grid-area: actions; display: none; }
    .grid.list-view .card-actions { grid-area: actions; margin-left: 0; }

    @media (max-width: 640px) {
      .grid.list-view .card {
        grid-template-columns: 1fr;
        grid-template-areas: "badge" "title" "actions";
      }
    }

    .card {
      padding: 14px 14px 12px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .card h3 {
      margin: 0;
      font-size: 1rem;
    }

    .content {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: pre-wrap;
      max-height: 220px;
      overflow: auto;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .badge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.9;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
    }

    .badge.badge-gemini {
      background: color-mix(in srgb, #10b981 24%, var(--surface-2));
      color: #10b981;
      border: 1px solid color-mix(in srgb, #10b981 45%, transparent);
    }

    .badge.badge-chatgpt {
      background: color-mix(in srgb, #22d3ee 22%, var(--surface-2));
      color: #06b6d4;
      border: 1px solid color-mix(in srgb, #06b6d4 45%, transparent);
    }

    .badge.badge-general {
      background: color-mix(in srgb, #f97316 22%, var(--surface-2));
      color: #f97316;
      border: 1px solid color-mix(in srgb, #f97316 45%, transparent);
    }

    .small {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty {
      margin-top: 10px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border-radius: 18px;
      border: 1px dashed var(--border);
      font-size: 0.9rem;
    }

    .hidden {
      display: none;
    }

    .import-card {
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .import-card h3 {
      margin: 0;
      font-size: 0.95rem;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
    }

    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font: inherit;
      min-height: 120px;
      resize: vertical;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(820px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      display: grid;
      gap: 14px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
    }

    input::placeholder {
      color: var(--placeholder);
    }

    .theme-select {
      width: 150px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .foot-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    @media (max-width: 820px) {
      body {
        padding: 14px 10px 18px;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar-row {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar-grid {
        grid-template-columns: 1fr;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .modal-card {
        width: 100%;
        max-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="topbar">
      <div class="brand">
        <div class="brand-badge">🧠</div>
        <div>
          <h1>PromptSave</h1>
          <p>Prompts sammeln, suchen, importieren und exportieren.</p>
        </div>
      </div>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Verbinde ...</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-row">
        <button class="btn primary" id="newBtn">Neuer Prompt</button>
        <button class="btn secondary" id="exportBtn">CSV exportieren</button>
        <div class="theme-controls">
          <button class="btn secondary" id="modeToggleBtn" type="button">☀️ Hell</button>
          <select id="themeSelect" class="theme-select" aria-label="Theme wählen">
            <option value="frost">❄️ Frost</option>
            <option value="mint">🌿 Mint</option>
            <option value="sunset">🌅 Sunset</option>
            <option value="ember">🔥 Ember</option>
            <option value="ocean">🌊 Ocean</option>
            <option value="violet">🔮 Violet</option>
          </select>
        </div>
      </div>
      <div class="toolbar-grid">
        <input id="searchInput" class="search" type="text" placeholder="Suchen nach Titel oder Inhalt ..." />
        <select id="categoryFilter">
          <option value="all">Alle Kategorien</option>
          <option value="gemini">gemini</option>
          <option value="chatgpt">chatgpt</option>
          <option value="general">general</option>
        </select>
      </div>
      <div class="toolbar-row">
        <button class="btn secondary" id="gridViewBtn" type="button" data-view="grid">🪟 Grid</button>
        <button class="btn secondary" id="listViewBtn" type="button" data-view="list">📄 Liste</button>
      </div>
    </section>

    <section id="cards" class="grid"></section>
    <section id="emptyState" class="empty hidden">Noch keine Prompts vorhanden.</section>

    <section class="import-card">
      <div>
        <h3>📥 Import &amp; Export</h3>
        <p class="hint">
          CSV-Format: <code>title,content,category</code> — Kategorien: <code>gemini</code>, <code>chatgpt</code>, <code>general</code>.
        </p>
      </div>
      <textarea
        id="csvInput"
        placeholder="title,content,category&#10;Mein Prompt,Erstelle eine Unterrichtsidee,general"
      ></textarea>
      <div class="toolbar-row">
        <button class="btn secondary" id="importBtn">CSV importieren</button>
        <div class="hint" id="importMessage"></div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Neuer Prompt</h2>
        <button class="btn" id="closeModalBtn">Schließen</button>
      </div>
      <div class="form-grid">
        <label>Titel *
          <input type="text" id="titleInput" maxlength="200" />
        </label>
        <label>Kategorie *
          <select id="categoryInput">
            <option value="gemini">gemini</option>
            <option value="chatgpt">chatgpt</option>
            <option value="general">general</option>
          </select>
        </label>
        <label>Prompt-Inhalt *
          <textarea id="contentInput" maxlength="10000"></textarea>
        </label>
      </div>
      <div class="foot-actions">
        <button class="btn" id="cancelBtn">Abbrechen</button>
        <button class="btn primary" id="saveBtn">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '../api.php';

    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return m ? decodeURIComponent(m[2]) : '';
    }
    const apiPassword = getCookie('hotlinkstuff_pw');

    let prompts = [];
    let editingId = null;
    const THEME_MODE_KEY = 'promptsave_mode';
    const THEME_NAME_KEY = 'promptsave_theme';
    const VIEW_MODE_KEY = 'promptsave_view_mode';

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const cards = document.getElementById('cards');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const titleInput = document.getElementById('titleInput');
    const categoryInput = document.getElementById('categoryInput');
    const contentInput = document.getElementById('contentInput');
    const csvInput = document.getElementById('csvInput');
    const importMessage = document.getElementById('importMessage');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const themeSelect = document.getElementById('themeSelect');
    const gridViewBtn = document.getElementById('gridViewBtn');
    const listViewBtn = document.getElementById('listViewBtn');

    async function apiRequest(action, payload = {}) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          resource: 'prompts',
          action,
          password: apiPassword,
          ...payload
        })
      });
      return response.json();
    }

    function setStatus(ok, message) {
      statusDot.className = 'dot ' + (ok ? 'ok' : 'error');
      statusText.textContent = message;
    }

    async function loadPrompts() {
      const result = await apiRequest('getAll');
      if (!result.success) throw new Error(result.message || 'Laden fehlgeschlagen');
      prompts = sortNewestFirst(result.prompts || []);
      renderPrompts();
      setStatus(true, 'Verbindung OK');
    }

    function parseDateValue(value) {
      if (!value) return 0;
      const ts = Date.parse(value);
      return Number.isNaN(ts) ? 0 : ts;
    }

    function formatDate(value) {
      if (!value) return '-';
      const ts = Date.parse(value);
      if (Number.isNaN(ts)) return value;
      const d = new Date(ts);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function sortNewestFirst(list) {
      return [...list].sort((a, b) => {
        const timeA = parseDateValue(a.updated_at) || parseDateValue(a.created_at);
        const timeB = parseDateValue(b.updated_at) || parseDateValue(b.created_at);
        if (timeA !== timeB) return timeB - timeA;
        const idA = Number(a.id);
        const idB = Number(b.id);
        if (!Number.isNaN(idA) && !Number.isNaN(idB) && idA !== idB) return idB - idA;
        return String(b.id || '').localeCompare(String(a.id || ''));
      });
    }

    function applyThemeSettings(mode, theme) {
      document.body.dataset.mode = mode;
      document.body.dataset.theme = theme;
      modeToggleBtn.textContent = mode === 'dark' ? '☀️ Hell' : '🌙 Dunkel';
      themeSelect.value = theme;
    }

    function applyViewMode(mode) {
      localStorage.setItem(VIEW_MODE_KEY, mode);
      renderPrompts(); // Re-render to apply class
      gridViewBtn.classList.toggle('active', mode === 'grid');
      listViewBtn.classList.toggle('active', mode === 'list');
    }

    function applyColsSetting(cols) {
      localStorage.setItem('hotlinkstuff_cols', cols);
      renderPrompts();
    }

    function getCardClasses() {
      const viewMode = localStorage.getItem(VIEW_MODE_KEY) || 'grid';
      const cols = localStorage.getItem('hotlinkstuff_cols') || '3';
      const classes = ['grid'];
      if (viewMode === 'list') classes.push('list-view');
      else if (cols === '1') classes.push('cols-1');
      else if (cols === '2') classes.push('cols-2');
      return classes.join(' ');
    }

    function notifyShell() {
      window.parent?.postMessage({ type: 'module-preferences' }, '*');
    }

    function initThemeSettings() {
      const savedMode = localStorage.getItem('hotlinkstuff_mode') || localStorage.getItem(THEME_MODE_KEY) || 'dark';
      const savedTheme = localStorage.getItem('hotlinkstuff_theme') || localStorage.getItem(THEME_NAME_KEY) || 'frost';
      const savedViewMode = localStorage.getItem(VIEW_MODE_KEY) || 'grid';
      applyThemeSettings(savedMode, savedTheme);
      applyViewMode(savedViewMode);
      if (localStorage.getItem('hotlinkstuff_cols')) renderPrompts();
    }

    function getFilteredPrompts() {
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;
      return prompts.filter(prompt => {
        const categoryMatch = cat === 'all' ? true : prompt.category === cat;
        const haystack = [prompt.title, prompt.content, prompt.category].join(' ').toLowerCase();
        const searchMatch = q === '' ? true : haystack.includes(q);
        return categoryMatch && searchMatch;
      });
    }

    function renderPrompts() {
      const filtered = getFilteredPrompts();
      cards.innerHTML = '';
      emptyState.classList.toggle('hidden', filtered.length !== 0);
      if (!filtered.length) return;

      cards.className = getCardClasses();

      filtered.forEach(prompt => {
        const badge = getCategoryBadge(prompt.category);
        const article = document.createElement('article');
        article.className = 'card';
        article.innerHTML = `
          <div class="meta"><span class="badge ${badge.className}">${escapeHtml(badge.label)}</span></div>
          <h3>${escapeHtml(prompt.title)}</h3>
          <div class="content">${escapeHtml(prompt.content)}</div>
          <div class="small">Aktualisiert: ${escapeHtml(formatDate(prompt.updated_at))}</div>
          <div class="card-actions">
            <button class="btn" data-copy="${prompt.id}">Kopieren</button>
            <button class="btn" data-edit="${prompt.id}">Bearbeiten</button>
            <button class="btn danger" data-delete="${prompt.id}">Löschen</button>
          </div>
        `;
        cards.appendChild(article);
      });
    }

    function getCategoryBadge(category) {
      switch (String(category || '').toLowerCase()) {
        case 'gemini':
          return { className: 'badge-gemini', label: 'Gemini' };
        case 'chatgpt':
          return { className: 'badge-chatgpt', label: 'ChatGPT' };
        default:
          return { className: 'badge-general', label: 'General' };
      }
    }

    function openModal(prompt = null) {
      editingId = prompt ? prompt.id : null;
      modalTitle.textContent = prompt ? 'Prompt bearbeiten' : 'Neuer Prompt';
      titleInput.value = prompt?.title || '';
      categoryInput.value = prompt?.category || 'general';
      contentInput.value = prompt?.content || '';
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function savePrompt() {
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      const category = categoryInput.value;
      if (!title || !content) {
        alert('Titel und Inhalt sind Pflichtfelder.');
        return;
      }
      if (content.length > 10000) {
        alert('Maximal 10.000 Zeichen pro Prompt.');
        return;
      }
      const prompt = { id: editingId, title, content, category };
      const result = editingId
        ? await apiRequest('update', { prompt })
        : await apiRequest('create', { prompt });
      if (!result.success) {
        alert(result.message || 'Fehler beim Speichern');
        return;
      }
      closeModal();
      await loadPrompts();
    }

    async function deletePrompt(id) {
      if (!confirm('Prompt wirklich löschen?')) return;
      const result = await apiRequest('delete', { id });
      if (!result.success) {
        alert(result.message || 'Fehler beim Löschen');
        return;
      }
      await loadPrompts();
    }

    async function exportCsv() {
      const result = await apiRequest('exportCsv');
      if (!result.success) {
        alert(result.message || 'CSV-Export fehlgeschlagen');
        return;
      }
      const rows = result.rows || [];
      const csv = ['title,content,category']
        .concat(rows.map(r => [r.title, r.content, r.category].map(csvEscape).join(',')))
        .join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'prompts-export.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function csvEscape(value) {
      const text = String(value ?? '');
      return '"' + text.replace(/"/g, '""') + '"';
    }

    async function importCsv() {
      const csv = csvInput.value.trim();
      if (!csv) {
        importMessage.textContent = 'Bitte CSV-Inhalt einfügen.';
        return;
      }
      const result = await apiRequest('importCsv', { csv });
      importMessage.textContent = result.message || '';
      if (result.success) {
        csvInput.value = '';
        await loadPrompts();
      }
    }

    async function copyPrompt(id) {
      const prompt = prompts.find(x => String(x.id) === String(id));
      if (!prompt) return;
      try {
        await navigator.clipboard.writeText(prompt.content || '');
        alert('Prompt in die Zwischenablage kopiert.');
      } catch {
        alert('Kopieren nicht möglich.');
      }
    }

    document.getElementById('newBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveBtn').addEventListener('click', savePrompt);
    document.getElementById('exportBtn').addEventListener('click', exportCsv);
    document.getElementById('importBtn').addEventListener('click', importCsv);
    modeToggleBtn.addEventListener('click', () => {
      const nextMode = document.body.dataset.mode === 'dark' ? 'light' : 'dark';
      applyThemeSettings(nextMode, themeSelect.value);
      localStorage.setItem(THEME_MODE_KEY, nextMode);
      localStorage.setItem('hotlinkstuff_mode', nextMode);
      notifyShell();
    });
    themeSelect.addEventListener('change', () => {
      const mode = document.body.dataset.mode || 'dark';
      applyThemeSettings(mode, themeSelect.value);
      localStorage.setItem(THEME_NAME_KEY, themeSelect.value);
      localStorage.setItem('hotlinkstuff_theme', themeSelect.value);
      notifyShell();
    });
    gridViewBtn.addEventListener('click', () => applyViewMode('grid'));
    listViewBtn.addEventListener('click', () => applyViewMode('list'));
    searchInput.addEventListener('input', renderPrompts);
    categoryFilter.addEventListener('change', renderPrompts);

    initThemeSettings();

    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || d.type !== 'shell-preferences') return;
      if (d.mode) {
        applyThemeSettings(d.mode, d.theme);
        localStorage.setItem(THEME_MODE_KEY, d.mode);
        localStorage.setItem(THEME_NAME_KEY, d.theme);
      }
      if (d.cols) {
        applyColsSetting(d.cols);
      }
    });

    cards.addEventListener('click', e => {
      const editId = e.target.getAttribute('data-edit');
      const deleteId = e.target.getAttribute('data-delete');
      const copyId = e.target.getAttribute('data-copy');
      if (editId) {
        const prompt = prompts.find(x => String(x.id) === String(editId));
        if (prompt) openModal(prompt);
      }
      if (deleteId) deletePrompt(deleteId);
      if (copyId) copyPrompt(copyId);
    });

    if (!apiPassword) {
      setStatus(false, 'Kein Passwort – bitte über die Login-Seite anmelden.');
    } else {
      setStatus(false, 'Verbindung wird geprüft ...');
      loadPrompts().catch(err => setStatus(false, err.message || 'Fehler beim Laden'));
    }
  </script>
</body>
</html>
