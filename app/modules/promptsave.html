<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptSave</title>
  <style>
    :root {
      --bg: #020617;
      --surface: #0b1120;
      --surface-2: #020617;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #0ea5e9;   /* PromptSave kühl */
      --accent-2: #6366f1; /* Sekundär */
      --danger: #ef4444;
      --radius: 18px;
      --shadow: 0 14px 32px rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 18px 12px 22px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .topbar {
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
    }

    .dot.ok { background: #22c55e; }
    .dot.error { background: var(--danger); }

    .toolbar {
      padding: 14px 16px;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) 220px;
      gap: 10px;
    }

    .search {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
    }

    .search::placeholder {
      color: #6b7280;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font: inherit;
    }

    .btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }

    .btn.secondary {
      background: #020617;
      border-color: var(--border);
    }

    .btn.danger {
      background: #020617;
      border-color: #fecaca;
      color: var(--danger);
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .card {
      padding: 14px 14px 12px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .card h3 {
      margin: 0;
      font-size: 1rem;
    }

    .content {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: pre-wrap;
      max-height: 220px;
      overflow: auto;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
    }

    .badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: #0f172a;
      color: #22d3ee;
      font-weight: 600;
    }

    .small {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty {
      margin-top: 10px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border-radius: 18px;
      border: 1px dashed var(--border);
      font-size: 0.9rem;
    }

    .hidden {
      display: none;
    }

    .import-card {
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .import-card h3 {
      margin: 0;
      font-size: 0.95rem;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
    }

    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font: inherit;
      min-height: 120px;
      resize: vertical;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(820px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      display: grid;
      gap: 14px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font: inherit;
    }

    input::placeholder {
      color: #6b7280;
    }

    .foot-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    @media (max-width: 820px) {
      body {
        padding: 14px 10px 18px;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar-row {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar-grid {
        grid-template-columns: 1fr;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .modal-card {
        width: 100%;
        max-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="topbar">
      <div class="brand">
        <div class="brand-badge">🧠</div>
        <div>
          <h1>PromptSave</h1>
          <p>Prompts sammeln, suchen, importieren und exportieren.</p>
        </div>
      </div>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Verbinde ...</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-row">
        <button class="btn primary" id="newBtn">Neuer Prompt</button>
        <button class="btn secondary" id="exportBtn">CSV exportieren</button>
      </div>
      <div class="toolbar-grid">
        <input id="searchInput" class="search" type="text" placeholder="Suchen nach Titel oder Inhalt ..." />
        <select id="categoryFilter">
          <option value="all">Alle Kategorien</option>
          <option value="gemini">gemini</option>
          <option value="chatgpt">chatgpt</option>
          <option value="general">general</option>
        </select>
      </div>
    </section>

    <section id="cards" class="grid"></section>
    <section id="emptyState" class="empty hidden">Noch keine Prompts vorhanden.</section>

    <section class="import-card">
      <div>
        <h3>📥 Import &amp; Export</h3>
        <p class="hint">
          CSV-Format: <code>title,content,category</code> — Kategorien: <code>gemini</code>, <code>chatgpt</code>, <code>general</code>.
        </p>
      </div>
      <textarea
        id="csvInput"
        placeholder="title,content,category&#10;Mein Prompt,Erstelle eine Unterrichtsidee,general"
      ></textarea>
      <div class="toolbar-row">
        <button class="btn secondary" id="importBtn">CSV importieren</button>
        <div class="hint" id="importMessage"></div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Neuer Prompt</h2>
        <button class="btn" id="closeModalBtn">Schließen</button>
      </div>
      <div class="form-grid">
        <label>Titel *
          <input type="text" id="titleInput" maxlength="200" />
        </label>
        <label>Kategorie *
          <select id="categoryInput">
            <option value="gemini">gemini</option>
            <option value="chatgpt">chatgpt</option>
            <option value="general">general</option>
          </select>
        </label>
        <label>Prompt-Inhalt *
          <textarea id="contentInput" maxlength="10000"></textarea>
        </label>
      </div>
      <div class="foot-actions">
        <button class="btn" id="cancelBtn">Abbrechen</button>
        <button class="btn primary" id="saveBtn">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '../api.php';

    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return m ? decodeURIComponent(m[2]) : '';
    }
    const apiPassword = getCookie('hotlinkstuff_pw');

    let prompts = [];
    let editingId = null;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const cards = document.getElementById('cards');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const titleInput = document.getElementById('titleInput');
    const categoryInput = document.getElementById('categoryInput');
    const contentInput = document.getElementById('contentInput');
    const csvInput = document.getElementById('csvInput');
    const importMessage = document.getElementById('importMessage');

    async function apiRequest(action, payload = {}) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          resource: 'prompts',
          action,
          password: apiPassword,
          ...payload
        })
      });
      return response.json();
    }

    function setStatus(ok, message) {
      statusDot.className = 'dot ' + (ok ? 'ok' : 'error');
      statusText.textContent = message;
    }

    async function loadPrompts() {
      const result = await apiRequest('getAll');
      if (!result.success) throw new Error(result.message || 'Laden fehlgeschlagen');
      prompts = result.prompts || [];
      renderPrompts();
      setStatus(true, 'Verbindung OK');
    }

    function getFilteredPrompts() {
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;
      return prompts.filter(prompt => {
        const categoryMatch = cat === 'all' ? true : prompt.category === cat;
        const haystack = [prompt.title, prompt.content, prompt.category].join(' ').toLowerCase();
        const searchMatch = q === '' ? true : haystack.includes(q);
        return categoryMatch && searchMatch;
      });
    }

    function renderPrompts() {
      const filtered = getFilteredPrompts();
      cards.innerHTML = '';
      emptyState.classList.toggle('hidden', filtered.length !== 0);
      if (!filtered.length) return;

      filtered.forEach(prompt => {
        const article = document.createElement('article');
        article.className = 'card';
        article.innerHTML = `
          <div class="meta"><span class="badge">${escapeHtml(prompt.category)}</span></div>
          <h3>${escapeHtml(prompt.title)}</h3>
          <div class="content">${escapeHtml(prompt.content)}</div>
          <div class="small">Aktualisiert: ${escapeHtml(prompt.updated_at || '-')}</div>
          <div class="card-actions">
            <button class="btn" data-copy="${prompt.id}">Kopieren</button>
            <button class="btn" data-edit="${prompt.id}">Bearbeiten</button>
            <button class="btn danger" data-delete="${prompt.id}">Löschen</button>
          </div>
        `;
        cards.appendChild(article);
      });
    }

    function openModal(prompt = null) {
      editingId = prompt ? prompt.id : null;
      modalTitle.textContent = prompt ? 'Prompt bearbeiten' : 'Neuer Prompt';
      titleInput.value = prompt?.title || '';
      categoryInput.value = prompt?.category || 'general';
      contentInput.value = prompt?.content || '';
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function savePrompt() {
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      const category = categoryInput.value;
      if (!title || !content) {
        alert('Titel und Inhalt sind Pflichtfelder.');
        return;
      }
      if (content.length > 10000) {
        alert('Maximal 10.000 Zeichen pro Prompt.');
        return;
      }
      const prompt = { id: editingId, title, content, category };
      const result = editingId
        ? await apiRequest('update', { prompt })
        : await apiRequest('create', { prompt });
      if (!result.success) {
        alert(result.message || 'Fehler beim Speichern');
        return;
      }
      closeModal();
      await loadPrompts();
    }

    async function deletePrompt(id) {
      if (!confirm('Prompt wirklich löschen?')) return;
      const result = await apiRequest('delete', { id });
      if (!result.success) {
        alert(result.message || 'Fehler beim Löschen');
        return;
      }
      await loadPrompts();
    }

    async function exportCsv() {
      const result = await apiRequest('exportCsv');
      if (!result.success) {
        alert(result.message || 'CSV-Export fehlgeschlagen');
        return;
      }
      const rows = result.rows || [];
      const csv = ['title,content,category']
        .concat(rows.map(r => [r.title, r.content, r.category].map(csvEscape).join(',')))
        .join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'prompts-export.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function csvEscape(value) {
      const text = String(value ?? '');
      return '"' + text.replace(/"/g, '""') + '"';
    }

    async function importCsv() {
      const csv = csvInput.value.trim();
      if (!csv) {
        importMessage.textContent = 'Bitte CSV-Inhalt einfügen.';
        return;
      }
      const result = await apiRequest('importCsv', { csv });
      importMessage.textContent = result.message || '';
      if (result.success) {
        csvInput.value = '';
        await loadPrompts();
      }
    }

    async function copyPrompt(id) {
      const prompt = prompts.find(x => String(x.id) === String(id));
      if (!prompt) return;
      try {
        await navigator.clipboard.writeText(prompt.content || '');
        alert('Prompt in die Zwischenablage kopiert.');
      } catch {
        alert('Kopieren nicht möglich.');
      }
    }

    document.getElementById('newBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveBtn').addEventListener('click', savePrompt);
    document.getElementById('exportBtn').addEventListener('click', exportCsv);
    document.getElementById('importBtn').addEventListener('click', importCsv);
    searchInput.addEventListener('input', renderPrompts);
    categoryFilter.addEventListener('change', renderPrompts);

    cards.addEventListener('click', e => {
      const editId = e.target.getAttribute('data-edit');
      const deleteId = e.target.getAttribute('data-delete');
      const copyId = e.target.getAttribute('data-copy');
      if (editId) {
        const prompt = prompts.find(x => String(x.id) === String(editId));
        if (prompt) openModal(prompt);
      }
      if (deleteId) deletePrompt(deleteId);
      if (copyId) copyPrompt(copyId);
    });

    if (!apiPassword) {
      setStatus(false, 'Kein Passwort – bitte über die Login-Seite anmelden.');
    } else {
      setStatus(false, 'Verbindung wird geprüft ...');
      loadPrompts().catch(err => setStatus(false, err.message || 'Fehler beim Laden'));
    }
  </script>
</body>
</html>
