<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown-Import</title>
  <style>
    :root { --bg:#0b0e17; --panel:#121729; --text:#eef1fb; --muted:#9aa3c0; --border:rgba(255,255,255,.1); --accent:#7c5cff; }
    * { box-sizing:border-box; }
    body { margin:0; padding:clamp(12px,4vw,32px); background:var(--bg); color:var(--text); font:16px system-ui,sans-serif; }
    .card { max-width:860px; margin:auto; padding:clamp(18px,4vw,32px); background:var(--panel); border:1px solid var(--border); border-radius:20px; }
    h1 { margin:0 0 8px; color:var(--accent); font-size:clamp(1.35rem,4vw,2rem); }
    p { color:var(--muted); margin:0 0 22px; line-height:1.5; }
    label { display:block; margin:16px 0 7px; color:var(--muted); font-weight:600; }
    input, select, textarea { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:12px; background:#090c14; color:var(--text); font:inherit; }
    textarea { min-height:300px; resize:vertical; line-height:1.45; }
    .row { display:grid; grid-template-columns:1fr 180px; gap:12px; }
    .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px; }
    button { padding:11px 16px; border:0; border-radius:999px; background:linear-gradient(135deg,#7c5cff,#ff5c8a); color:white; cursor:pointer; font:inherit; font-weight:600; }
    #status { color:var(--muted); }
    @media (max-width:600px) { .row { grid-template-columns:1fr; } textarea { min-height:240px; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>📥 Markdown-Import</h1>
    <p>Importiere eine Markdown-Datei als Prompt. Optionales Frontmatter mit <code>title:</code> und <code>category:</code> wird automatisch ausgewertet.</p>
    <label for="mdFile">Markdown-Datei</label>
    <input id="mdFile" type="file" accept=".md,.markdown,text/markdown">
    <div class="row">
      <div>
        <label for="titleInput">Titel (optional)</label>
        <input id="titleInput" type="text" placeholder="Importiertes Dokument">
      </div>
      <div>
        <label for="categoryInput">Kategorie</label>
        <select id="categoryInput">
          <option value="general">general</option>
          <option value="gemini">gemini</option>
          <option value="chatgpt">chatgpt</option>
        </select>
      </div>
    </div>
    <label for="mdContent">Inhalt</label>
    <textarea id="mdContent" placeholder="Datei auswählen oder Markdown hier einfügen ..."></textarea>
    <div class="actions">
      <button id="importBtn" type="button">Markdown importieren</button>
      <span id="status" role="status"></span>
    </div>
  </main>
  <script>
    const API_URL = '../api.php';
    const password = decodeURIComponent((document.cookie.match(/(?:^|;\s*)hotlinkstuff_pw=([^;]+)/) || [,''])[1]);
    const fileInput = document.getElementById('mdFile');
    const contentInput = document.getElementById('mdContent');
    const titleInput = document.getElementById('titleInput');
    const categoryInput = document.getElementById('categoryInput');
    const status = document.getElementById('status');

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (file) contentInput.value = await file.text();
    });

    function readFrontmatter(content) {
      const match = content.match(/^---\s*\n([\s\S]*?)\n---\s*/);
      if (!match) return { content, title: '', category: '' };
      const title = (match[1].match(/^title:\s*(.+)$/m) || [,''])[1].trim();
      const category = (match[1].match(/^category:\s*(.+)$/m) || [,''])[1].trim().toLowerCase();
      return { content: content.slice(match[0].length).trim(), title, category };
    }

    document.getElementById('importBtn').addEventListener('click', async () => {
      const parsed = readFrontmatter(contentInput.value.trim());
      const title = titleInput.value.trim() || parsed.title || 'Importiertes Dokument';
      const category = ['general', 'gemini', 'chatgpt'].includes(parsed.category) ? parsed.category : categoryInput.value;
      if (!parsed.content) { status.textContent = 'Bitte Inhalt eingeben oder Datei wählen.'; return; }
      status.textContent = 'Import läuft ...';
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resource: 'prompts', action: 'create', password, prompt: { title, content: parsed.content, category } })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || `HTTP ${response.status}`);
        status.textContent = 'Erfolgreich importiert.';
        contentInput.value = '';
        fileInput.value = '';
      } catch (error) {
        status.textContent = `Import fehlgeschlagen: ${error.message}`;
      }
    });
  </script>
</body>
</html>
