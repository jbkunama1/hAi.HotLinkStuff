<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotStuff</title>
  <style>
    :root {
      --bg: #020617;
      --surface: #0b1120;
      --surface-2: #020617;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #ea580c;
      --accent-2: #0f766e;
      --danger: #ef4444;
      --radius: 18px;
      --shadow: 0 14px 32px rgba(15, 23, 42, 0.45);
      --overlay: rgba(15, 23, 42, 0.65);
      --placeholder: #6b7280;
      --badge-bg: #1f2937;
      --badge-text: #f97316;
      --glow-a: rgba(234, 88, 12, 0.35);
      --glow-b: rgba(15, 118, 110, 0.35);
      --scrollbar-track: rgba(15, 23, 42, 0.55);
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 62%, var(--accent-2));
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent) 52%, #ffffff);
    }

    body[data-mode="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #eef2ff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
      --overlay: rgba(15, 23, 42, 0.35);
      --placeholder: #64748b;
      --badge-bg: #e2e8f0;
      --badge-text: #9a3412;
      --glow-a: rgba(249, 115, 22, 0.18);
      --glow-b: rgba(15, 118, 110, 0.18);
      --scrollbar-track: #dbeafe;
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 72%, #1f2937);
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent-2) 70%, #1f2937);
      --scrollbar-track: #dbeafe;
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 72%, #1f2937);
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent-2) 70%, #1f2937);
    }

    body[data-theme="ocean"] {
      --accent: #0284c7;
      --accent-2: #0f766e;
      --badge-text: #0369a1;
      --glow-a: rgba(2, 132, 199, 0.35);
      --glow-b: rgba(15, 118, 110, 0.35);
      --scrollbar-track: rgba(15, 23, 42, 0.55);
      --scrollbar-thumb: color-mix(in srgb, var(--accent) 62%, var(--accent-2));
      --scrollbar-thumb-hover: color-mix(in srgb, var(--accent) 52%, #ffffff);
    }

    body[data-theme="violet"] {
      --accent: #7c3aed;
      --accent-2: #2563eb;
      --badge-text: #6d28d9;
      --glow-a: rgba(124, 58, 237, 0.35);
      --glow-b: rgba(37, 99, 235, 0.35);
    }

    * { box-sizing: border-box; }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 999px;
    }

    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--scrollbar-thumb), var(--accent-2));
      border-radius: 999px;
      border: 2px solid var(--scrollbar-track);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--scrollbar-thumb-hover), var(--accent));
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 999px;
    }

    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--scrollbar-thumb), var(--accent-2));
      border-radius: 999px;
      border: 2px solid var(--scrollbar-track);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--scrollbar-thumb-hover), var(--accent));
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, var(--glow-a), transparent 54%),
        radial-gradient(circle at bottom right, var(--glow-b), transparent 54%),
        var(--bg);
      color: var(--text);
      padding: 18px 12px 22px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .topbar {
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
    }

    .dot.ok { background: #22c55e; }
    .dot.error { background: var(--danger); }

    .toolbar {
      padding: 14px 16px;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .theme-controls {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .search::placeholder {
      color: var(--placeholder);
    }

    .btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }

    .btn.secondary {
      background: var(--surface-2);
      border-color: var(--border);
    }

    .btn.danger {
      background: var(--surface-2);
      border-color: #fecaca;
      color: var(--danger);
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

        .btn.active {
          background: var(--accent);
          border-color: transparent;
          color: #fff;
        }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .grid.list-view {
          grid-template-columns: 1fr;
    }

    .grid.list-view .card {
     display: flex;
     flex-direction: row;
     gap: 16px;
     align-items: center;
     padding: 12px 18px;
    }

    .grid.list-view .card .meta {
     order: 1;
     white-space: nowrap;
    }

    .grid.list-view .card h3 {
     order: 2;
     flex: 1;
     min-width: 0;
    }

    .grid.list-view .card .desc {
     display: none;
    }

    .grid.list-view .card .thumb {
     order: 3;
     width: 80px;
     height: 80px;
     flex-shrink: 0;
     border-radius: 12px;
    }

    .grid.list-view .card .link {
     order: 4;
     display: none;
    }

    .grid.list-view .card .small {
     order: 5;
     white-space: nowrap;
    }

    .grid.list-view .card-actions {
     order: 6;
     margin-left: auto;
     flex-shrink: 0;
    }

    .card {
      padding: 14px 14px 12px;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .card h3 {
      margin: 0;
      font-size: 1rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
    }

    .badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 600;
    }

    .desc {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: pre-wrap;
      max-height: 200px;
      overflow: auto;
    }

    .thumb {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      max-height: 200px;
      object-fit: cover;
    }

    .image-preview-wrap {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .image-preview-wrap.hidden {
      display: none;
    }

    .image-preview {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      border: 1px solid var(--border);
      object-fit: contain;
    }

    .btn-remove-image {
      align-self: flex-start;
    }

    .link {
      color: var(--accent-2);
      font-size: 0.9rem;
      text-decoration: none;
      word-break: break-all;
    }

    .link:hover {
      text-decoration: underline;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty {
      margin-top: 10px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border-radius: 18px;
      border: 1px dashed var(--border);
      font-size: 0.9rem;
    }

    .hidden {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(720px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input[type="text"],
    input[type="url"],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--placeholder);
    }

    .theme-select {
      width: 150px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .foot-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    @media (max-width: 820px) {
      body {
        padding: 14px 10px 18px;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar-row {
        flex-direction: column;
        align-items: stretch;
      }
      .search {
        width: 100%;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .modal-card {
        width: 100%;
        max-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="topbar">
      <div class="brand">
        <div class="brand-badge">🔥</div>
        <div>
          <h1>Heisser Scheiss Manager</h1>
          <p>Text, Bilder und Links in einer Sammlung.</p>
        </div>
      </div>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Verbinde ...</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-row">
        <input id="searchInput" class="search" type="text" placeholder="Suchen nach Titel, Text oder Link ..." />
        <button class="btn primary" id="newBtn">Neuer Eintrag</button>
        <button class="btn secondary" id="exportBtn">JSON exportieren</button>
        <div class="theme-controls">
          <button class="btn secondary" id="modeToggleBtn" type="button">☀️ Hell</button>
          <select id="themeSelect" class="theme-select" aria-label="Theme wählen">
            <option value="ember">Ember</option>
            <option value="ocean">Ocean</option>
            <option value="violet">Violet</option>
          </select>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">📚 Alle</button>
        <button class="tab-btn" data-filter="text">📝 Text</button>
        <button class="tab-btn" data-filter="image">🖼️ Bilder</button>
        <button class="tab-btn" data-filter="link">🔗 Links</button>
        <div class="view-controls">
          <button class="btn secondary" id="gridViewBtn" type="button" data-view="grid">🪟 Grid</button>
          <button class="btn secondary" id="listViewBtn" type="button" data-view="list">📄 Liste</button>
        </div>
      </div>
    </section>

    <section id="cards" class="grid"></section>
    <section id="emptyState" class="empty hidden">Noch keine Einträge vorhanden.</section>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Neuer Eintrag</h2>
        <button class="btn" id="closeModalBtn">Schließen</button>
      </div>
      <div class="form-grid">
        <label>Titel *
          <input type="text" id="titleInput" />
        </label>
        <label>Kategorie *
          <select id="categoryInput">
            <option value="">-- Wählen --</option>
            <option value="text">📝 Text</option>
            <option value="image">🖼️ Bilder</option>
            <option value="link">🔗 Links</option>
          </select>
        </label>
        <label>Anleitung/Beschreibung
          <textarea id="contentInput"></textarea>
        </label>
        <label>Bild hochladen
          <input type="file" id="imageInput" accept="image/*" />
        </label>
        <div id="imagePreviewWrap" class="image-preview-wrap hidden">
          <img id="imagePreview" class="image-preview" alt="Bildvorschau" />
          <button type="button" class="btn danger btn-remove-image" id="removeImageBtn">✕ Bild entfernen</button>
        </div>
        <label>URL
          <input type="url" id="linkInput" placeholder="https://..." />
        </label>
      </div>
      <div class="foot-actions">
        <button class="btn" id="cancelBtn">Abbrechen</button>
        <button class="btn primary" id="saveBtn">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '../api.php';

    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return m ? decodeURIComponent(m[2]) : '';
    }
    const apiPassword = getCookie('hotlinkstuff_pw');

    let items = [];
    let activeFilter = 'all';
    let editingId = null;
    let currentImageData = '';
    const THEME_MODE_KEY = 'hotstuff_mode';
    const THEME_NAME_KEY = 'hotstuff_theme';
    const VIEW_MODE_KEY = 'hotstuff_view_mode';

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const cards = document.getElementById('cards');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const titleInput = document.getElementById('titleInput');
    const categoryInput = document.getElementById('categoryInput');
    const contentInput = document.getElementById('contentInput');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewWrap = document.getElementById('imagePreviewWrap');
    const imagePreview = document.getElementById('imagePreview');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const linkInput = document.getElementById('linkInput');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const themeSelect = document.getElementById('themeSelect');
    const gridViewBtn = document.getElementById('gridViewBtn');
    const listViewBtn = document.getElementById('listViewBtn');

    async function apiRequest(action, payload = {}) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          resource: 'items',
          action,
          password: apiPassword,
          ...payload
        })
      });
      return response.json();
    }

    function setStatus(ok, message) {
      statusDot.className = 'dot ' + (ok ? 'ok' : 'error');
      statusText.textContent = message;
    }

    async function loadItems() {
      const result = await apiRequest('getAll');
      if (!result.success) throw new Error(result.message || 'Laden fehlgeschlagen');
      items = sortNewestFirst(result.items || []);
      renderItems();
      setStatus(true, 'Verbindung OK');
    }

    function parseDateValue(value) {
      if (!value) return 0;
      const ts = Date.parse(value);
      return Number.isNaN(ts) ? 0 : ts;
    }

    function formatDate(value) {
      if (!value) return '-';
      const ts = Date.parse(value);
      if (Number.isNaN(ts)) return value;
      const d = new Date(ts);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function sortNewestFirst(list) {
      return [...list].sort((a, b) => {
        const timeA = parseDateValue(a.updated_at) || parseDateValue(a.created_at);
        const timeB = parseDateValue(b.updated_at) || parseDateValue(b.created_at);
        if (timeA !== timeB) return timeB - timeA;
        const idA = Number(a.id);
        const idB = Number(b.id);
        if (!Number.isNaN(idA) && !Number.isNaN(idB) && idA !== idB) return idB - idA;
        return String(b.id || '').localeCompare(String(a.id || ''));
      });
    }

    function applyThemeSettings(mode, theme) {
      document.body.dataset.mode = mode;
      document.body.dataset.theme = theme;
      modeToggleBtn.textContent = mode === 'dark' ? '☀️ Hell' : '🌙 Dunkel';
      themeSelect.value = theme;
    }

    function applyViewMode(mode) {
      localStorage.setItem(VIEW_MODE_KEY, mode);
      renderItems(); // Re-render to apply class
      gridViewBtn.classList.toggle('active', mode === 'grid');
      listViewBtn.classList.toggle('active', mode === 'list');
    }

    function initThemeSettings() {
      const savedMode = localStorage.getItem(THEME_MODE_KEY) || 'dark';
      const savedTheme = localStorage.getItem(THEME_NAME_KEY) || 'ember';
      const savedViewMode = localStorage.getItem(VIEW_MODE_KEY) || 'grid';
      applyThemeSettings(savedMode, savedTheme);
      applyViewMode(savedViewMode);
    }

    function getFilteredItems() {
      const q = searchInput.value.trim().toLowerCase();
      return items.filter(item => {
        const categoryMatch = activeFilter === 'all' ? true : item.category === activeFilter;
        const text = [item.title, item.content, item.link].join(' ').toLowerCase();
        const searchMatch = q === '' ? true : text.includes(q);
        return categoryMatch && searchMatch;
      });
    }

    function renderItems() {
      const filtered = getFilteredItems();
      cards.innerHTML = '';
      emptyState.classList.toggle('hidden', filtered.length !== 0);
      if (!filtered.length) return;

      cards.className = `grid ${localStorage.getItem(VIEW_MODE_KEY) === 'list' ? 'list-view' : ''}`;

      filtered.forEach(item => {
        const article = document.createElement('article');
        article.className = 'card';
        article.innerHTML = `
          <div class="meta"><span class="badge">${escapeHtml(item.category || '')}</span></div>
          <h3>${escapeHtml(item.title || '')}</h3>
          ${item.image ? `<img class="thumb" src="${item.image}" alt="${escapeHtml(item.title || 'Bild')}" />` : ''}
          ${item.content ? `<div class="desc">${escapeHtml(item.content)}</div>` : ''}
          ${item.link ? `<a class="link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.link)}</a>` : ''}
          <div class="small">Erstellt: ${escapeHtml(formatDate(item.created_at))}</div>
          <div class="card-actions">
            <button class="btn" data-edit="${item.id}">Bearbeiten</button>
            <button class="btn danger" data-delete="${item.id}">Löschen</button>
          </div>
        `;
        cards.appendChild(article);
      });
    }

    function openModal(item = null) {
      editingId = item ? item.id : null;
      modalTitle.textContent = item ? 'Eintrag bearbeiten' : 'Neuer Eintrag';
      titleInput.value = item?.title || '';
      categoryInput.value = item?.category || '';
      contentInput.value = item?.content || '';
      linkInput.value = item?.link || '';
      currentImageData = item?.image || '';
      imageInput.value = '';
      if (currentImageData) {
        imagePreview.src = currentImageData;
        imagePreviewWrap.classList.remove('hidden');
      } else {
        imagePreviewWrap.classList.add('hidden');
      }
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function saveItem() {
      const title = titleInput.value.trim();
      const category = categoryInput.value;
      if (!title || !category) {
        alert('Titel und Kategorie sind Pflichtfelder.');
        return;
      }
      const file = imageInput.files[0];
      const imageData = file ? await fileToBase64(file) : currentImageData;
      const item = {
        id: editingId,
        title,
        category,
        content: contentInput.value.trim(),
        link: linkInput.value.trim(),
        image: imageData || ''
      };
      const result = editingId
        ? await apiRequest('update', { item })
        : await apiRequest('create', { item });
      if (!result.success) {
        alert(result.message || 'Fehler beim Speichern');
        return;
      }
      closeModal();
      await loadItems();
    }

    async function deleteItem(id) {
      if (!confirm('Eintrag wirklich löschen?')) return;
      const result = await apiRequest('delete', { id });
      if (!result.success) {
        alert(result.message || 'Fehler beim Löschen');
        return;
      }
      await loadItems();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'hotstuff-export.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderItems();
      });
    });

    searchInput.addEventListener('input', renderItems);
    document.getElementById('newBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveBtn').addEventListener('click', saveItem);
    document.getElementById('exportBtn').addEventListener('click', exportJson);

    // Bild-Vorschau im Modal anzeigen, sobald eine Datei ausgewählt wird
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        fileToBase64(file).then(dataUrl => {
          imagePreview.src = dataUrl;
          imagePreviewWrap.classList.remove('hidden');
        });
      }
    });

    // Vorhandenes/aktuelles Bild entfernen
    removeImageBtn.addEventListener('click', () => {
      currentImageData = '';
      imageInput.value = '';
      imagePreviewWrap.classList.add('hidden');
    });
    modeToggleBtn.addEventListener('click', () => {
      const nextMode = document.body.dataset.mode === 'dark' ? 'light' : 'dark';
      applyThemeSettings(nextMode, themeSelect.value);
      localStorage.setItem(THEME_MODE_KEY, nextMode);
    });
    themeSelect.addEventListener('change', () => {
      const mode = document.body.dataset.mode || 'dark';
      applyThemeSettings(mode, themeSelect.value);
      localStorage.setItem(THEME_NAME_KEY, themeSelect.value);
    });
    gridViewBtn.addEventListener('click', () => applyViewMode('grid'));
    listViewBtn.addEventListener('click', () => applyViewMode('list'));

    initThemeSettings();

    cards.addEventListener('click', e => {
      const editId = e.target.getAttribute('data-edit');
      const deleteId = e.target.getAttribute('data-delete');
      if (editId) {
        const item = items.find(x => String(x.id) === String(editId));
        if (item) openModal(item);
      }
      if (deleteId) deleteItem(deleteId);
    });

    if (!apiPassword) {
      setStatus(false, 'Kein Passwort – bitte über die Login-Seite anmelden.');
    } else {
      setStatus(false, 'Verbindung wird geprüft ...');
      loadItems().catch(err => setStatus(false, err.message || 'Fehler beim Laden'));
    }
  </script>
</body>
</html>
