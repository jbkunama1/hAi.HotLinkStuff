<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotStuff</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #142338;
      --muted: #64748b;
      --accent: #ea580c;
      --accent-2: #0f766e;
      --border: #d9e2ec;
      --danger: #dc2626;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(20, 35, 56, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .wrap { max-width: 1400px; margin: 0 auto; }
    .topbar, .toolbar, .modal-card, .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .topbar {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .brand { display: flex; gap: 14px; align-items: center; }
    .brand-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 26px;
    }
    .brand h1 { margin: 0; font-size: 1.35rem; }
    .brand p { margin: 5px 0 0; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; }
    .dot.ok { background: #22c55e; }
    .dot.error { background: var(--danger); }
    .toolbar {
      padding: 16px;
      margin-bottom: 16px;
      display: grid;
      gap: 14px;
    }
    .toolbar-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn, .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active, .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn.secondary {
      background: var(--accent-2);
      color: #fff;
      border-color: var(--accent-2);
    }
    .btn.danger {
      background: #fff;
      color: var(--danger);
      border-color: #fecaca;
    }
    .search {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card { padding: 18px; display: grid; gap: 12px; }
    .card h3 { margin: 0; font-size: 1.05rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .desc { color: var(--muted); white-space: pre-wrap; }
    .thumb {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      max-height: 220px;
      object-fit: cover;
    }
    .link { word-break: break-all; color: var(--accent-2); text-decoration: none; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-card {
      width: min(720px, 100%);
      padding: 22px;
      max-height: 92vh;
      overflow: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-head h2 { margin: 0; }
    .form-grid { display: grid; gap: 14px; }
    label { display: grid; gap: 8px; font-weight: 600; }
    input[type="text"], input[type="url"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      font: inherit;
    }
    textarea { min-height: 140px; resize: vertical; }
    .foot-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    @media (max-width: 820px) {
      body { padding: 14px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .toolbar-row { flex-direction: column; align-items: stretch; }
      .search { width: 100%; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="appWrap">
    <section class="topbar">
      <div class="brand">
        <div class="brand-badge">🔥</div>
        <div>
          <h1>Heisser Scheiss Manager</h1>
          <p>Text, Bilder und Links in einer Sammlung.</p>
        </div>
      </div>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Verbinde ...</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-row">
        <input id="searchInput" class="search" type="text" placeholder="Suchen nach Titel, Text oder Link ..." />
        <button class="btn primary" id="newBtn">Neuer Eintrag</button>
        <button class="btn secondary" id="exportBtn">JSON exportieren</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">📚 Alle</button>
        <button class="tab-btn" data-filter="text">📝 Text</button>
        <button class="tab-btn" data-filter="image">🖼️ Bilder</button>
        <button class="tab-btn" data-filter="link">🔗 Links</button>
      </div>
    </section>

    <section id="cards" class="grid"></section>
    <section id="emptyState" class="empty hidden">Noch keine Einträge vorhanden.</section>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Neuer Eintrag</h2>
        <button class="btn" id="closeModalBtn">Schließen</button>
      </div>
      <div class="form-grid">
        <label>Titel *
          <input type="text" id="titleInput" />
        </label>
        <label>Kategorie *
          <select id="categoryInput">
            <option value="">-- Wählen --</option>
            <option value="text">📝 Text</option>
            <option value="image">🖼️ Bilder</option>
            <option value="link">🔗 Links</option>
          </select>
        </label>
        <label>Anleitung/Beschreibung
          <textarea id="contentInput"></textarea>
        </label>
        <label>Bild hochladen
          <input type="file" id="imageInput" accept="image/*" />
        </label>
        <label>URL
          <input type="url" id="linkInput" placeholder="https://..." />
        </label>
      </div>
      <div class="foot-actions">
        <button class="btn" id="cancelBtn">Abbrechen</button>
        <button class="btn primary" id="saveBtn">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '../api.php';

    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return m ? decodeURIComponent(m[2]) : '';
    }
    const apiPassword = getCookie('hotlinkstuff_pw');

    let items = [];
    let activeFilter = 'all';
    let editingId = null;
    let currentImageData = '';

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const cards = document.getElementById('cards');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const titleInput = document.getElementById('titleInput');
    const categoryInput = document.getElementById('categoryInput');
    const contentInput = document.getElementById('contentInput');
    const imageInput = document.getElementById('imageInput');
    const linkInput = document.getElementById('linkInput');

    async function apiRequest(action, payload = {}) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          resource: 'items',
          action,
          password: apiPassword,
          ...payload
        })
      });
      return response.json();
    }

    function setStatus(ok, message) {
      statusDot.className = 'dot ' + (ok ? 'ok' : 'error');
      statusText.textContent = message;
    }

    async function loadItems() {
      const result = await apiRequest('getAll');
      if (!result.success) throw new Error(result.message || 'Laden fehlgeschlagen');
      items = result.items || [];
      renderItems();
      setStatus(true, 'Verbindung OK');
    }

    function getFilteredItems() {
      const q = searchInput.value.trim().toLowerCase();
      return items.filter(item => {
        const categoryMatch = activeFilter === 'all' ? true : item.category === activeFilter;
        const text = [item.title, item.content, item.link].join(' ').toLowerCase();
        const searchMatch = q === '' ? true : text.includes(q);
        return categoryMatch && searchMatch;
      });
    }

    function renderItems() {
      const filtered = getFilteredItems();
      cards.innerHTML = '';
      emptyState.classList.toggle('hidden', filtered.length !== 0);
      if (!filtered.length) return;

      filtered.forEach(item => {
        const article = document.createElement('article');
        article.className = 'card';
        article.innerHTML = `
          <div class="meta"><span class="badge">${escapeHtml(item.category || '')}</span></div>
          <h3>${escapeHtml(item.title || '')}</h3>
          ${item.image ? `<img class="thumb" src="${item.image}" alt="${escapeHtml(item.title || 'Bild')}" />` : ''}
          ${item.content ? `<div class="desc">${escapeHtml(item.content)}</div>` : ''}
          ${item.link ? `<a class="link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.link)}</a>` : ''}
          <div class="hint">Erstellt: ${escapeHtml(item.created_at || '-')}</div>
          <div class="card-actions">
            <button class="btn" data-edit="${item.id}">Bearbeiten</button>
            <button class="btn danger" data-delete="${item.id}">Löschen</button>
          </div>
        `;
        cards.appendChild(article);
      });
    }

    function openModal(item = null) {
      editingId = item ? item.id : null;
      modalTitle.textContent = item ? 'Eintrag bearbeiten' : 'Neuer Eintrag';
      titleInput.value = item?.title || '';
      categoryInput.value = item?.category || '';
      contentInput.value = item?.content || '';
      linkInput.value = item?.link || '';
      currentImageData = item?.image || '';
      imageInput.value = '';
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function saveItem() {
      const title = titleInput.value.trim();
      const category = categoryInput.value;
      if (!title || !category) {
        alert('Titel und Kategorie sind Pflichtfelder.');
        return;
      }
      const file = imageInput.files[0];
      const imageData = file ? await fileToBase64(file) : currentImageData;
      const item = {
        id: editingId,
        title,
        category,
        content: contentInput.value.trim(),
        link: linkInput.value.trim(),
        image: imageData || ''
      };
      const result = editingId
        ? await apiRequest('update', { item })
        : await apiRequest('create', { item });
      if (!result.success) {
        alert(result.message || 'Fehler beim Speichern');
        return;
      }
      closeModal();
      await loadItems();
    }

    async function deleteItem(id) {
      if (!confirm('Eintrag wirklich löschen?')) return;
      const result = await apiRequest('delete', { id });
      if (!result.success) {
        alert(result.message || 'Fehler beim Löschen');
        return;
      }
      await loadItems();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'hotstuff-export.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderItems();
      });
    });

    searchInput.addEventListener('input', renderItems);
    document.getElementById('newBtn').addEventListener('click', () => openModal());
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveBtn').addEventListener('click', saveItem);
    document.getElementById('exportBtn').addEventListener('click', exportJson);

    cards.addEventListener('click', e => {
      const editId = e.target.getAttribute('data-edit');
      const deleteId = e.target.getAttribute('data-delete');
      if (editId) {
        const item = items.find(x => String(x.id) === String(editId));
        if (item) openModal(item);
      }
      if (deleteId) deleteItem(deleteId);
    });

    if (!apiPassword) {
      setStatus(false, 'Kein Passwort – bitte über die Login-Seite anmelden.');
    } else {
      setStatus(false, 'Verbindung wird geprüft ...');
      loadItems().catch(err => setStatus(false, err.message || 'Fehler beim Laden'));
    }
  </script>
</body>
</html>
