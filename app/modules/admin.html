<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <style>
    :root {
      /* Shared design system - ideally imported from app.css */
      --bg: #0b0e17;
      --panel: rgba(18, 23, 41, 0.85);
      --text: #eef1fb;
      --accent: #7c5cff;
      --border: rgba(255,255,255,0.08);
      --radius: 22px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      padding: 2rem;
      margin: 0;
    }
    .admin-card {
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: var(--accent); }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #9aa3c0; }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      color: white;
    }
    button {
      background: linear-gradient(135deg, #7c5cff, #ff5c8a);
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="admin-card">
    <h1>System Administration</h1>
    <div class="form-group">
      <label for="adminDefaultTheme">Standard-Theme (für alle neuen Benutzer)</label>
      <select id="adminDefaultTheme">
        <option value="cloud">Cloud (High-End)</option>
        <option value="ember">Ember</option>
        <option value="ocean">Ocean</option>
        <option value="violet">Violet</option>
        <option value="frost">Frost</option>
        <option value="mint">Mint</option>
        <option value="sunset">Sunset</option>
      </select>
      <button id="saveAdminTheme" style="margin-top: 10px;">Standard speichern</button>
      <span id="saveStatus" style="margin-left: 10px; color: #24d1c4; display: none;">Gespeichert!</span>
    </div>
    <div class="form-group">
      <label>Benutzerverwaltung</label>
      <p>Hier werden Benutzer verwaltet (Platzhalter)</p>
    </div>
    <div class="form-group">
      <label>System-Konfiguration</label>
      <button>Cache leeren</button>
      <button>Logs exportieren</button>
    </div>
  </div>
  <script>
    const adminDefaultTheme = document.getElementById('adminDefaultTheme');
    const saveAdminTheme = document.getElementById('saveAdminTheme');
    const saveStatus = document.getElementById('saveStatus');

    const savedDefault = localStorage.getItem('hotlinkstuff_admin_default_theme') || 'cloud';
    adminDefaultTheme.value = savedDefault;

    saveAdminTheme.addEventListener('click', () => {
      localStorage.setItem('hotlinkstuff_admin_default_theme', adminDefaultTheme.value);
      saveStatus.style.display = 'inline';
      setTimeout(() => { saveStatus.style.display = 'none'; }, 2000);
      // Notify parent/shell if needed
      window.parent.postMessage({ type: 'admin-default-theme-changed', theme: adminDefaultTheme.value }, '*');
    });
  </script>
</body>
</html>
