<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <style>
    :root {
      /* Shared design system - ideally imported from app.css */
      --bg: #0b0e17;
      --panel: rgba(18, 23, 41, 0.85);
      --text: #eef1fb;
      --accent: #7c5cff;
      --border: rgba(255,255,255,0.08);
      --radius: 22px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      padding: 1rem;
      margin: 0;
    }
    .admin-card {
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: var(--accent); font-size: clamp(1.35rem, 4vw, 1.8rem); margin: 0 0 1rem; }
    .admin-intro { color: #9aa3c0; margin: -0.5rem 0 1rem; font-size: .9rem; }
    .admin-section { border-top: 1px solid var(--border); }
    .admin-section summary {
      cursor: pointer;
      list-style: none;
      padding: 1rem 0;
      font-weight: 700;
    }
    .admin-section summary::-webkit-details-marker { display: none; }
    .admin-section summary::after { content: '+'; float: right; color: #9aa3c0; }
    .admin-section[open] summary::after { content: '−'; }
    .admin-section-content { padding: 0 0 1rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; color: #9aa3c0; }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      color: white;
    }
    .select-grid { display: grid; gap: .75rem; }
    .button-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    button {
      background: linear-gradient(135deg, #7c5cff, #ff5c8a);
      color: white;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="admin-card">
    <h1>Admin</h1>
    <p class="admin-intro">Seltene Einstellungen bleiben hier, damit die Arbeitsfläche kompakt bleibt.</p>
    <details class="admin-section" open>
      <summary>Darstellung und Layout</summary>
      <div class="admin-section-content">
        <div class="select-grid">
          <div>
            <label for="adminThemeSelect">Design-Theme (Global)</label>
            <select id="adminThemeSelect">
        <option value="cloud">☁️ Cloud (High-End)</option>
        <option value="ember">🔥 Ember</option>
        <option value="ocean">🌊 Ocean</option>
        <option value="violet">🔮 Violet</option>
        <option value="frost">❄️ Frost</option>
        <option value="mint">🌿 Mint</option>
        <option value="sunset">🌅 Sunset</option>
            </select>
          </div>
          <div>
            <label for="adminLayoutSelect">Spalten-Layout</label>
            <select id="adminLayoutSelect">
        <option value="3">▦ 3 Spalten</option>
        <option value="2">▤ 2 Spalten</option>
        <option value="1">▬ Untereinander</option>
            </select>
          </div>
          <div>
            <label for="adminModeSelect">Anzeigemodus</label>
            <select id="adminModeSelect">
        <option value="dark">🌙 Dunkel</option>
        <option value="light">☀️ Hell</option>
            </select>
          </div>
        </div>
        <div class="button-row" style="margin-top: 1rem;">
          <button id="savePreferences">Einstellungen speichern</button>
          <span id="saveStatus" style="color: #24d1c4; display: none;">Gespeichert!</span>
        </div>
      </div>
    </details>
    <details class="admin-section">
      <summary>Daten-Export</summary>
      <div class="admin-section-content">
        <div class="button-row">
          <button id="exportHotstuffBtn" type="button">HotStuff JSON</button>
          <button id="exportPromptsaveBtn" type="button">PromptSave JSON</button>
        </div>
        <span id="exportStatus" style="display: none; color: #24d1c4;"></span>
      </div>
    </details>
    <details class="admin-section">
      <summary>System und Benutzer</summary>
      <div class="admin-section-content">
        <p>Benutzerverwaltung ist vorbereitet, aber noch nicht aktiviert.</p>
        <div class="button-row">
          <button type="button">Cache leeren</button>
          <button type="button">Logs exportieren</button>
        </div>
      </div>
    </details>
  </div>
  <script>
    const adminThemeSelect = document.getElementById('adminThemeSelect');
    const adminLayoutSelect = document.getElementById('adminLayoutSelect');
    const adminModeSelect = document.getElementById('adminModeSelect');
    const savePreferences = document.getElementById('savePreferences');
    const saveStatus = document.getElementById('saveStatus');

    adminThemeSelect.value = localStorage.getItem('hotlinkstuff_theme') || 'cloud';
    adminLayoutSelect.value = localStorage.getItem('hotlinkstuff_cols') || '3';
    adminModeSelect.value = localStorage.getItem('hotlinkstuff_mode') || 'dark';

    savePreferences.addEventListener('click', () => {
      localStorage.setItem('hotlinkstuff_theme', adminThemeSelect.value);
      localStorage.setItem('hotlinkstuff_cols', adminLayoutSelect.value);
      localStorage.setItem('hotlinkstuff_mode', adminModeSelect.value);
      
      saveStatus.style.display = 'inline';
      setTimeout(() => { saveStatus.style.display = 'none'; }, 2000);
      
      window.parent.postMessage({ 
        type: 'shell-preferences', 
        theme: adminThemeSelect.value, 
        cols: adminLayoutSelect.value, 
        mode: adminModeSelect.value 
      }, '*');
    });

        // Export buttons - send message to specific module iframe
        const exportHotstuffBtn = document.getElementById('exportHotstuffBtn');
        const exportPromptsaveBtn = document.getElementById('exportPromptsaveBtn');
        const exportStatus = document.getElementById('exportStatus');

        function triggerExport(module, label) {
          const frame = window.parent.document.getElementById('contentFrame');
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage({ type: 'export-json', module }, '*');
            exportStatus.textContent = `${label} Export gestartet...`;
            exportStatus.style.display = 'inline';
            setTimeout(() => { exportStatus.style.display = 'none'; }, 3000);
          }
        }

        exportHotstuffBtn.addEventListener('click', () => triggerExport('hotstuff', 'HotStuff'));
        exportPromptsaveBtn.addEventListener('click', () => triggerExport('promptsave', 'PromptSave'));
  </script>
</body>
</html>
