version: "3.8"

services:
  hotlinkstuff:
    image: ghcr.io/jbkunama1/hai-hotlinkstuff:latest
    container_name: hai-hotlinkstuff
    restart: unless-stopped
    ports:
      - "8095:80"
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      # Set DATA_PATH to an absolute host path in Portainer, or use the bundled data directory.
      - ${DATA_PATH:-../data}:/var/www/data
